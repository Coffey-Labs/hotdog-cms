# The site's settings. name and url are required; everything else has a default.
name: {{SITE_NAME}}
url: https://example.org
language: en
description: A site built with HotDog CMS.
author: Your Name

# Every folder in content/ is a collection. Settings here change its defaults.
collections:
  articles:
    layout: article
    feed: true

# Front matter keys that become browsable pages: /tags/ and /tags/<tag>/.
taxonomies: [tags]

menus:
  main:
    - { name: Home, url: / }
    - { name: Articles, url: /articles/ }
    - { name: About, url: /about/ }
    - { name: Contact, url: /contact/ }
  footer:
    - { name: Tags, url: /tags/ }
    - { name: Feed, url: /articles/feed.xml }

outputs:
  llms: true

# A picture for link previews (Mastodon, LinkedIn, chat apps), drawn for
# every page that doesn't set image: in its front matter. Its colors follow
# look.yaml; set font:, background:, text:, accent: or logo: to choose.
cards: true
# Your fediverse handle, which Mastodon credits in link previews.
# fediverse: "@you@your.instance"
# Patterns `hotdog-cms check` refuses to publish: internal host names, private
# addresses, anything that must never reach the public site.
check:
  forbid: []
