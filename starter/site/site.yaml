# The site's settings. name and url are required; everything else has a default.
name: {{SITE_NAME}}
url: https://example.org
language: en
description: A site built with HotDog CMS.
author: Your Name
# Where the site's events happen; event and banner times are read in it.
# timezone: America/Phoenix

# Long lists (a collection's page, a tag's page) split into pages of this
# many: /articles/, /articles/page/2/, ... A collection can set its own.
paginate: 12

# Every folder in content/ is a collection. Settings here change its defaults.
collections:
  articles:
    layout: article
    feed: true
    # paginate: 20

# Front matter keys that become browsable pages: /tags/ and /tags/<tag>/.
taxonomies: [tags]

menus:
  main:
    - { name: Home, url: / }
    - { name: Articles, url: /articles/ }
    - { name: About, url: /about/ }
    - { name: Contact, url: /contact/ }
  footer:
    - { name: Tags, url: /tags/ }
    - { name: Feed, url: /articles/feed.xml }
    - { name: Privacy, url: /privacy/ }

outputs:
  llms: true

# A picture for link previews (Mastodon, LinkedIn, chat apps), drawn for
# every page that doesn't set image: in its front matter. Its colors follow
# look.yaml; set font:, background:, text:, accent: or logo: to choose.
cards: true
# Visit statistics, counted only after a visitor agrees (a consent banner
# asks; "Cookie settings" in the footer changes the answer). One of:
# analytics: { provider: plausible, domain: example.org }
# analytics: { provider: matomo, url: "https://matomo.example.org/", site_id: "1" }
# analytics: { provider: ga4, id: G-XXXXXXX }
#
# Who answers for visitors' data, for the privacy notice (/privacy/).
# privacy: { controller: Your Name, contact: privacy@example.org }
#
# Your fediverse handle, which Mastodon credits in link previews.
# fediverse: "@you@your.instance"
# Patterns `hotdog-cms check` refuses to publish: internal host names, private
# addresses, anything that must never reach the public site.
check:
  forbid: []
