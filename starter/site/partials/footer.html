<footer class="foot">
  <div class="wrap foot-in">
    <p>© {{ (now).Year }} {{ .Site.Config.Name }}</p>
    <ul>
      {{ range menu "footer" }}<li><a href="{{ .URL }}">{{ .Name }}</a></li>{{ end }}
      {{ if consentActive }}<li><button type="button" class="link-btn" data-hotdog-consent-open>Cookie settings</button></li>{{ end }}
    </ul>
  </div>
</footer>
