{{ define "main" }}
<link rel="stylesheet" href="{{ asset "packs/recipes/recipes.css" }}">
<section class="wrap page recipes">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  <ul class="rc-grid">{{ range .Paginator.Items }}{{ template "recipe-card" . }}{{ end }}</ul>
  {{ template "pagination" . }}
</section>
{{ end }}
