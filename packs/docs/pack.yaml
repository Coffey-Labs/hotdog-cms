name: docs
version: 1.3.0
title: Documentation
description: A documentation section with a sidebar of parts and pages (as deep as you like), a breadcrumb, an on-this-page list, a page for each part, and previous and next links, in the order you set.
license: MIT
author: Coffey Labs LLC
collections:
  docs:
    layout: doc
    list_layout: doc-index
    sort: weight
    search: true
notes: |
  Write pages under content/docs/, the docs' front page as
  content/docs/_index.md (layout: doc-home for a cover with a card per part,
  or doc for a page like the rest), and a heading's own page as _index.md in
  its folder.

  Then set the reading order in data/docs-nav.yaml. Each entry is a page's
  source file, a heading over more entries (with a page of its own or not),
  or a link elsewhere:

    - docs/_index.md
    - title: Install
      page: docs/install/_index.md
      blurb: Getting it onto your computer.
      children:
        - docs/install/linux.md
        - title: On a Mac
          page: docs/install/macos.md
        - title: Coming from elsewhere
          children: [docs/install/from-x.md, docs/install/from-y.md]
    - title: Back to the main site
      url: https://example.org/

  That list draws the sidebar, the breadcrumb, each heading's page and the
  previous and next links. Sites using the first format (part:, title:,
  blurb:, pages: [names]) keep working.

  For docs on a host of their own (docs.example.org/install/linux/ rather
  than /docs/install/linux/), give the collection path: / in site.yaml.
