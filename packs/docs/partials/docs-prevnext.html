{{/* Previous and next, through every page of the docs in reading order. */}}
{{ $nav := nav "docs-nav" . }}
<nav class="prevnext" aria-label="Previous and next">
  {{ with $nav.Prev }}<a class="prev" href="{{ .URL }}"><span>Previous</span>{{ .Title }}</a>{{ else }}<span></span>{{ end }}
  {{ with $nav.Next }}<a class="next" href="{{ .URL }}"><span>Next</span>{{ .Title }}</a>{{ end }}
</nav>
